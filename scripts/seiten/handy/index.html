<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzen</title>
<meta name="description" content="Ausgaben, Buchungen, Verträge und Vermögen des Haushalts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="app-installieren.js" data-name="Finanzen" data-farbe="#1f9d72" defer></script>
<style>
:root{
  --bg:#f4f3ef; --fl:#ffffff; --fl2:#ecebe6; --linie:#e2e0da;
  --text:#16191d; --text2:#4a515b; --leise:#7a818c;
  --akzent:#138a62; --akzent-fl:#dcf3e9; --akzent-text:#0d6b4b;
  --warn:#b7701a; --warn-fl:#fbeedb;
  --balken:#cfd3d9; --balken-lauf:#e3e6ea;
  --schatten:0 1px 2px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.05);
  --sheet:#ffffff; --deckel:rgba(15,18,21,.38);
  --r:18px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1215; --fl:#171b20; --fl2:#1f242b; --linie:#262c34;
    --text:#eef1f4; --text2:#b4bcc6; --leise:#808a97;
    --akzent:#4fd1a1; --akzent-fl:#12382b; --akzent-text:#6fe0b5;
    --warn:#f2b45c; --warn-fl:#3a2b14;
    --balken:#39414b; --balken-lauf:#2a3038;
    --schatten:none;
    --sheet:#1a1e24; --deckel:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  padding-top:env(safe-area-inset-top)}
.zahl,.betrag{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}

/* ---- Rahmen ---------------------------------------------------------- */
main{max-width:560px;margin:0 auto;padding:8px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.app-installieren-sichtbar main{padding-bottom:calc(var(--nav-h) + var(--app-installieren-hoehe) + 28px)}
.ansicht{display:none}.ansicht.an{display:block;animation:rein .22s ease-out}
@keyframes rein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kopf{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 14px}
.kopf h1{margin:0;font-size:clamp(24px,7.4vw,30px);white-space:nowrap;line-height:1.1;letter-spacing:-.025em;font-weight:750}
.kopf .unter{color:var(--leise);font-size:13px;margin-top:4px}
.karte{background:var(--fl);border-radius:var(--r);box-shadow:var(--schatten);padding:18px;margin-bottom:12px}
.karte h2{margin:0 0 12px;font-size:13px;font-weight:650;color:var(--leise);letter-spacing:.04em;text-transform:uppercase}
.fuss{color:var(--leise);font-size:12.5px;text-align:center;margin:18px 8px 4px;line-height:1.5}
.pille{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pille.gut{background:var(--akzent-fl);color:var(--akzent-text)}
.pille.acht{background:var(--warn-fl);color:var(--warn)}
.pille.neutral{background:var(--fl2);color:var(--text2)}
#offline{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:30}
#offline.an{display:inline-flex}
body.offline main{padding-top:40px}

/* ---- Monat ----------------------------------------------------------- */
.monatswahl{display:flex;align-items:center;gap:2px}
.monatswahl button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text2);background:var(--fl);box-shadow:var(--schatten)}
.monatswahl button:disabled{opacity:.3}
.held .titel{font-size:14px;color:var(--text2);font-weight:550}
.held .gross{font-size:44px;font-weight:760;letter-spacing:-.035em;line-height:1.05;margin:6px 0 10px}
.held .gross small{font-size:24px;font-weight:650;color:var(--text2);margin-left:3px}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--linie)}
.drei .l{font-size:12.5px;color:var(--leise)}
.drei .w{font-size:17px;font-weight:680;margin-top:2px}
.diagramm{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.diagramm::-webkit-scrollbar{display:none}
.diagramm svg{display:block}
.diagramm .bal{cursor:pointer}
.kat{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--linie)}
.kat:first-of-type{border-top:0;padding-top:2px}
.kat .z1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kat .n{font-weight:600;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kat .v{font-weight:650;font-size:15.5px}
.kat .spur{position:relative;height:6px;border-radius:3px;background:var(--fl2);margin:8px 0 5px}
.kat .fuell{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--akzent)}
.kat .fuell.drueber{background:var(--warn)}
.kat .mark{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--text)}
.kat .z2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--leise)}

/* ---- Listen ---------------------------------------------------------- */
.suche{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin:0 -2px}
.suchfeld{display:flex;align-items:center;gap:8px;background:var(--fl);border-radius:14px;padding:0 12px;box-shadow:var(--schatten);height:46px}
.suchfeld input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.suchfeld svg{color:var(--leise);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;padding:7px 13px;font-size:14px;font-weight:550;background:var(--fl);color:var(--text2);box-shadow:var(--schatten)}
.chip.an{background:var(--text);color:var(--bg)}
.tag{font-size:12.5px;font-weight:650;color:var(--leise);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 6px;display:flex;justify-content:space-between}
.gruppe{background:var(--fl);border-radius:var(--r);box-shadow:var(--schatten);overflow:hidden}
.zeile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:62px;position:relative}
.zeile+.zeile::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--linie)}
.zeile:active{background:var(--fl2)}
.ava{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--fl2);color:var(--text2)}
.ava.ein{background:var(--akzent-fl);color:var(--akzent-text)}
.mitte{flex:1;min-width:0}
.mitte .a{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitte .b{font-size:13px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rechts{text-align:right;flex:none}
.rechts .betrag{font-weight:650;font-size:15.5px}
.rechts .betrag.plus{color:var(--akzent-text)}
.rechts .klein{font-size:12px;color:var(--leise);margin-top:1px}
.punkt{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:1px}
.leer{text-align:center;color:var(--leise);padding:40px 20px}
.leer b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.mehr{display:block;margin:14px auto 0;color:var(--akzent-text);font-weight:600;padding:10px}

/* ---- Prüfen ---------------------------------------------------------- */
.pk{background:var(--fl);border-radius:var(--r);box-shadow:var(--schatten);padding:16px;margin-bottom:10px;transition:opacity .25s}
.pk.fertig{opacity:.5}
.pk .o{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pk .h{font-weight:650;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .betrag{font-weight:700;font-size:16.5px;white-space:nowrap;flex:none}
.pk .meta{font-size:13px;color:var(--leise);margin-top:2px}
.pk .vz{font-size:13px;color:var(--text2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pk .prod{font-size:13.5px;color:var(--akzent-text);font-weight:600;margin-top:6px}
.pk .vorschlag{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--leise)}
.pk .vorschlag b{color:var(--text);font-size:15px}
.pk .knoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.knopf{height:44px;border-radius:12px;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.knopf.haupt{background:var(--akzent);color:#fff}
@media (prefers-color-scheme: dark){.knopf.haupt{color:#08261b}}
.knopf.zweit{background:var(--fl2);color:var(--text)}
.fortschritt{height:6px;border-radius:3px;background:var(--fl2);overflow:hidden;margin-top:12px}
.fortschritt i{display:block;height:100%;background:var(--akzent);border-radius:3px;transition:width .3s}

/* ---- Navigation ------------------------------------------------------ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);
  border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom)}
.app-installieren-sichtbar nav.tabs{bottom:var(--app-installieren-hoehe)}
nav.tabs .reihe{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--leise);font-size:11px;font-weight:600;position:relative}
nav.tabs a.an{color:var(--text)}
nav.tabs a.an svg{color:var(--akzent)}
nav.tabs .zaehler{position:absolute;top:7px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 5px;min-width:18px;text-align:center}
@media (prefers-color-scheme: dark){nav.tabs .zaehler{color:#2a1c06}}

/* ---- Sheet ----------------------------------------------------------- */
#deckel{position:fixed;inset:0;background:var(--deckel);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
#deckel.an{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:22px 22px 0 0;
  max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#sheet.an{transform:none}
.griff{width:38px;height:5px;border-radius:3px;background:var(--linie);margin:2px auto 14px}
.sh-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-kopf h3{margin:0;font-size:20px;line-height:1.25;letter-spacing:-.015em;overflow-wrap:anywhere}
.zu{flex:none;width:34px;height:34px;border-radius:50%;background:var(--fl2);display:grid;place-items:center;color:var(--text2)}
.sh-betrag{font-size:36px;font-weight:760;letter-spacing:-.03em;margin:10px 0 2px}
.sh-betrag.plus{color:var(--akzent-text)}
.sh-meta{color:var(--leise);font-size:14px}
.feld{margin-top:18px}
.feld>.l{font-size:12.5px;font-weight:650;color:var(--leise);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
.kasten{background:var(--fl2);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--text2);overflow-wrap:anywhere}
.katwahl{display:flex;flex-wrap:wrap;gap:7px}
.katwahl button{border-radius:99px;padding:8px 13px;font-size:14px;font-weight:550;background:var(--fl2);color:var(--text)}
.katwahl button.an{background:var(--akzent);color:#fff}
@media (prefers-color-scheme: dark){.katwahl button.an{color:#08261b}}
.schalter{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.schalter:first-child{border-top:0}
.schalter .t{font-weight:600;font-size:15px}.schalter .u{font-size:12.5px;color:var(--leise)}
.schalter input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:var(--balken);position:relative;transition:background .2s;margin:0}
.schalter input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.schalter input:checked{background:var(--akzent)}
.schalter input:checked::after{transform:translateX(20px)}
textarea{width:100%;border:0;border-radius:12px;background:var(--fl2);padding:11px 13px;font-size:16px;min-height:76px;resize:vertical;outline:0}
textarea:focus{box-shadow:0 0 0 2px var(--akzent)}
.hinweis{font-size:12.5px;color:var(--leise);margin-top:16px;line-height:1.45}
.katsuche{width:100%;border:0;outline:0;border-radius:12px;background:var(--fl2);padding:11px 13px;font-size:16px;margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--text);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:14.5px;font-weight:600;z-index:50;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.an{opacity:1;transform:translate(-50%,0)}
.app-installieren-sichtbar #toast{bottom:calc(var(--nav-h) + var(--app-installieren-hoehe) + 16px)}

#sperre{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);place-items:center;padding:32px;text-align:center}
#sperre.an{display:grid}
#sperre h2{margin:14px 0 6px;font-size:22px}
#sperre p{color:var(--text2);margin:0 0 18px}
.lade{color:var(--leise);text-align:center;padding:60px 0}
</style>
</head>
<body>
<span id="offline" class="pille acht">Offline · letzter Stand</span>

<main>
  <!-- Monat -->
  <section class="ansicht" id="v-monat" aria-label="Monat">
    <div class="kopf">
      <div><h1 id="m-titel">Finanzen</h1><div class="unter" id="m-unter">&nbsp;</div></div>
      <div class="monatswahl">
        <button id="m-zurueck" aria-label="Vormonat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="m-vor" aria-label="Folgemonat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div id="m-inhalt"><div class="lade">Lädt …</div></div>
  </section>

  <!-- Buchungen -->
  <section class="ansicht" id="v-buchungen" aria-label="Buchungen">
    <div class="kopf"><div><h1>Buchungen</h1><div class="unter" id="b-unter">&nbsp;</div></div></div>
    <div class="suche">
      <label class="suchfeld">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="b-suche" type="search" placeholder="Händler, Zweck, Notiz …" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="chips" id="b-monate"></div>
    </div>
    <div id="b-liste"></div>
  </section>

  <!-- Prüfen -->
  <section class="ansicht" id="v-pruefen" aria-label="Prüfen">
    <div class="kopf"><div><h1>Prüfen</h1><div class="unter">Was die Automatik nur geraten hat</div></div></div>
    <div id="p-inhalt"><div class="lade">Lädt …</div></div>
  </section>

  <!-- Verträge -->
  <section class="ansicht" id="v-vertraege" aria-label="Verträge">
    <div class="kopf"><div><h1>Verträge</h1><div class="unter">Was regelmäßig kommt und geht</div></div></div>
    <div id="vt-inhalt"><div class="lade">Lädt …</div></div>
  </section>

  <!-- Vermögen -->
  <section class="ansicht" id="v-vermoegen" aria-label="Vermögen">
    <div class="kopf"><div><h1>Vermögen</h1><div class="unter" id="vm-unter">&nbsp;</div></div></div>
    <div id="vm-inhalt"><div class="lade">Lädt …</div></div>
  </section>
</main>

<nav class="tabs" aria-label="Bereiche"><div class="reihe">
  <a href="#monat" data-tab="monat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5"/><path d="M12 16V7"/><path d="M17 16v-8"/></svg>Monat</a>
  <a href="#buchungen" data-tab="buchungen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Buchungen</a>
  <a href="#pruefen" data-tab="pruefen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/></svg>Prüfen<span class="zaehler" id="zaehler" hidden></span></a>
  <a href="#vertraege" data-tab="vertraege"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg>Verträge</a>
  <a href="#vermoegen" data-tab="vermoegen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg>Vermögen</a>
</div></nav>

<div id="deckel"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="sperre"><div>
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--leise)"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
  <h2>Nicht angemeldet</h2>
  <p>Bitte zuerst bei xbuddy anmelden und die App dann neu öffnen.</p>
  <button class="knopf haupt" style="padding:0 22px;margin:0 auto" onclick="location.reload()">Erneut versuchen</button>
</div></div>

<script>
'use strict';
// ---- Hilfen ---------------------------------------------------------------
const $ = (s, w = document) => w.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('de-DE', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const nf2 = new Intl.NumberFormat('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const eur = (x) => nf0.format(Math.round(x)) + ' €';
const eur2 = (x) => nf2.format(x) + ' €';
const tsd = (x) => nf0.format(Math.round(x / 1000)) + ' Tsd. €';
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONK = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const ymName = (ym) => MON[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymKurz = (ym) => MONK[+ym.slice(5, 7) - 1];
const datumLang = (d) => new Date(d + 'T12:00:00').toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'long'});
const datumKurz = (d) => new Date(d + 'T12:00:00').toLocaleDateString('de-DE', {day: 'numeric', month: 'short', year: 'numeric'});
// "AMAZON PAYMENTS EUROPE" -> "Amazon Payments Europe"; Kürzel wie DKB, AG, GmbH bleiben.
const name = (h) => {
  h = String(h || '');
  const buchst = h.replace(/[^A-Za-zÄÖÜäöüß]/g, '');
  if (buchst.length < 5 || buchst !== buchst.toUpperCase()) return h;
  return h.split(' ').map((w) => w.length <= 3 ? w : w[0] + w.slice(1).toLowerCase()).join(' ');
};
const initial = (h) => (String(h || '?').replace(/[^A-Za-zÄÖÜäöü0-9]/g, '')[0] || '?').toUpperCase();
const QUELLE = {'ki-vorschlag': 'KI-Vorschlag', 'branche-osm': 'nach Branche', 'unkategorisiert': 'ungeklärt'};

const S = {ue: null, monat: null, kats: [], tab: 'monat', bMonat: null, bListe: [], pListe: null, vt: null, vm: null};
let offlineAnzeige = false;

async function api(weg, opt) {
  const r = await fetch('api/handy/' + weg, Object.assign({credentials: 'same-origin'}, opt || {}));
  if (r.status === 401) { $('#sperre').classList.add('an'); throw new Error('nicht angemeldet'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const off = r.headers.get('X-Finanzen-Offline') === '1';
  if (off !== offlineAnzeige) { offlineAnzeige = off; $('#offline').classList.toggle('an', off); document.body.classList.toggle('offline', off); }
  return r.json();
}
async function speichern(tid, patch) {
  const j = await api('bearbeiten', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({tx_id: tid}, patch))});
  if (!j.row) throw new Error(j.fehler || 'nicht gespeichert');
  return j.row;
}
let toastUhr;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('an');
  clearTimeout(toastUhr); toastUhr = setTimeout(() => el.classList.remove('an'), 2200);
}

// ---- Navigation ------------------------------------------------------------
const TABS = ['monat', 'buchungen', 'pruefen', 'vertraege', 'vermoegen'];
function zeige(tab) {
  if (!TABS.includes(tab)) tab = 'monat';
  S.tab = tab;
  document.querySelectorAll('.ansicht').forEach((v) => v.classList.toggle('an', v.id === 'v-' + tab));
  document.querySelectorAll('nav.tabs a').forEach((a) => a.classList.toggle('an', a.dataset.tab === tab));
  window.scrollTo(0, 0);
  ({monat: ladeMonat, buchungen: ladeBuchungen, pruefen: ladePruefen, vertraege: ladeVertraege, vermoegen: ladeVermoegen})[tab]();
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#sheet')) zeige(location.hash.slice(1)); });

// ---- Monat -----------------------------------------------------------------
async function ladeUebersicht() {
  S.ue = await api('uebersicht'); S.ueAlt = false;
  if (!S.monat) {
    // Start: der laufende Monat erst ab dem 15., davor der letzte volle Monat.
    const ms = S.ue.monate, letzter = ms[ms.length - 1];
    const tag = +(S.ue.letzte || '').slice(8, 10);
    const hatBis = ms.some((m) => m.ym === S.ue.bis);
    S.monat = !hatBis || (letzter.ym === S.ue.letzte.slice(0, 7) && tag >= 15) ? letzter.ym : S.ue.bis;
  }
  zaehler(S.ue.offen);
}
function zaehler(n) {
  const z = $('#zaehler'); z.hidden = !n; z.textContent = n > 999 ? '999+' : n;
}
async function ladeMonat() {
  try { if (!S.ue || S.ueAlt) await ladeUebersicht(); } catch (e) { if (!S.ue) return fehler('#m-inhalt', e); }
  zeichneMonat();
}
function zeichneMonat() {
  const u = S.ue, ms = u.monate, i = ms.findIndex((m) => m.ym === S.monat);
  const m = ms[i], sch = u.schnitt;
  $('#m-titel').textContent = ymName(m.ym);
  $('#m-unter').textContent = m.voll ? m.n + ' Buchungen' : 'läuft noch · bis ' + datumKurz(u.letzte);
  $('#m-zurueck').disabled = i <= 0;
  $('#m-vor').disabled = i >= ms.length - 1;

  let vergleich = '';
  if (m.voll && sch.konsum > 0) {
    const d = (m.konsum - sch.konsum) / sch.konsum;
    const p = Math.abs(Math.round(d * 100));
    vergleich = p < 3 ? `<span class="pille neutral">wie üblich</span>`
      : d < 0 ? `<span class="pille gut">↓ ${p} % unter Ø</span>`
              : `<span class="pille acht">↑ ${p} % über Ø</span>`;
    vergleich += ` <span style="color:var(--leise);font-size:13px;margin-left:4px">Ø ${eur(sch.konsum)}</span>`;
  } else if (!m.voll) {
    vergleich = `<span class="pille neutral">Monat läuft</span> <span style="color:var(--leise);font-size:13px;margin-left:4px">Ø ganzer Monat ${eur(sch.konsum)}</span>`;
  }
  const uebrig = m.ein - m.konsum - m.sparen;
  const kats = Object.entries(m.kat).filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...kats.map(([k, v]) => Math.max(v, sch.kat[k] || 0)));
  const katHtml = kats.map(([k, v]) => {
    const s = sch.kat[k] || 0, drueber = m.voll && s > 0 && v > s * 1.15;
    const diff = s > 0 ? (v - s) : null;
    return `<button class="kat" data-kat="${esc(k)}">
      <div class="z1"><span class="n">${esc(k)}</span><span class="v zahl">${eur(v)}</span></div>
      <div class="spur"><div class="fuell${drueber ? ' drueber' : ''}" style="width:${(v / max * 100).toFixed(1)}%"></div>
        ${s > 0 ? `<div class="mark" style="left:calc(${(s / max * 100).toFixed(1)}% - 1px)"></div>` : ''}</div>
      <div class="z2"><span>${s > 0 ? 'Ø ' + eur(s) : 'sonst selten'}</span><span>${diff === null || !m.voll ? '' : (diff >= 0 ? '+' : '−') + eur(Math.abs(diff))}</span></div>
    </button>`;
  }).join('');

  $('#m-inhalt').innerHTML = `
    <div class="karte held">
      <div class="titel">Ausgaben</div>
      <div class="gross zahl">${nf0.format(Math.round(m.konsum))}<small>€</small></div>
      <div>${vergleich}</div>
      <div class="drei">
        <div><div class="l">Einnahmen</div><div class="w zahl">${eur(m.ein)}</div></div>
        <div><div class="l">Gespart</div><div class="w zahl">${eur(m.sparen)}</div></div>
        <div><div class="l">Übrig</div><div class="w zahl" style="color:${uebrig < 0 ? 'var(--warn)' : 'var(--text)'}">${uebrig < 0 ? '−' : ''}${eur(Math.abs(uebrig))}</div></div>
      </div>
    </div>
    <div class="karte"><h2>Ausgaben je Monat</h2><div class="diagramm" id="diagramm"></div></div>
    <div class="karte"><h2>Wofür</h2>${katHtml || '<div class="leer">Noch keine Ausgaben in diesem Monat.</div>'}</div>
    <div class="fuss">Ausgaben ohne Sparen und interne Umbuchungen, wie in der Statistik am Rechner.<br>
      Ø aus den ${sch.monate.length} vollen Monaten ${sch.monate.length ? ymKurz(sch.monate[0]) + ' ' + sch.monate[0].slice(0, 4) + ' – ' + ymKurz(sch.monate.at(-1)) + ' ' + sch.monate.at(-1).slice(0, 4) : ''}. Der senkrechte Strich zeigt ihn je Kategorie.<br><a href="./?ansicht=desktop" style="color:var(--akzent-text);font-weight:600;display:inline-block;margin-top:10px;padding:6px">Zur Desktop-Ansicht</a></div>`;
  zeichneDiagramm();
  document.querySelectorAll('#m-inhalt .kat').forEach((b) => b.addEventListener('click', () => katSheet(m.ym, b.dataset.kat)));
}
function zeichneDiagramm() {
  const box = $('#diagramm'), ms = S.ue.monate, sch = S.ue.schnitt.konsum;
  const bw = 22, gap = 8, oben = 22, h = 120, unten = 22;
  const breite = Math.max(box.clientWidth, ms.length * (bw + gap) + gap);
  const versatz = breite - (ms.length * (bw + gap) - gap);   // rechtsbündig, Neuestes rechts
  const max = Math.max(sch, ...ms.map((m) => m.konsum)) * 1.08 || 1;
  const y = (v) => oben + h - Math.max(0, v) / max * h;
  const style = getComputedStyle(document.documentElement);
  const c = (n) => style.getPropertyValue(n).trim();
  let s = `<svg width="${breite}" height="${oben + h + unten}" role="img" aria-label="Ausgaben je Monat">`;
  ms.forEach((m, i) => {
    const x = versatz + i * (bw + gap) - gap / 2 - 0.5, an = m.ym === S.monat;
    const yt = y(m.konsum), r = Math.min(4, (oben + h - yt) / 2);
    const fill = an ? c('--akzent') : (m.voll ? c('--balken') : c('--balken-lauf'));
    // Balken mit gerundeter Oberkante, unten auf der Grundlinie
    s += `<g class="bal" data-ym="${m.ym}"><rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="${oben + h + unten}" fill="transparent"/>
      <path d="M${x} ${oben + h}V${yt + r}q0 -${r} ${r} -${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${oben + h}Z" fill="${fill}"/>
      <text x="${x + bw / 2}" y="${oben + h + 16}" text-anchor="middle" font-size="11" font-weight="${an ? 700 : 500}" fill="${an ? c('--text') : c('--leise')}">${ymKurz(m.ym)}</text>
      ${an ? `<text x="${x + bw / 2}" y="${yt - 7}" text-anchor="middle" font-size="11" font-weight="700" fill="${c('--text')}">${m.konsum < 1000 ? nf0.format(Math.round(m.konsum)) : nf1.format(m.konsum / 1000) + 'k'}</text>` : ''}</g>`;
  });
  if (sch > 0) {
    s += `<line x1="0" x2="${breite}" y1="${y(sch)}" y2="${y(sch)}" stroke="${c('--text2')}" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>
      <text x="4" y="${y(sch) - 5}" font-size="11" font-weight="600" fill="${c('--text2')}">Ø</text>`;
  }
  box.innerHTML = s + '</svg>';
  box.querySelectorAll('.bal').forEach((g) => g.addEventListener('click', () => { S.monat = g.dataset.ym; zeichneMonat(); }));
  const sel = box.querySelector(`.bal[data-ym="${S.monat}"]`);
  if (sel) box.scrollLeft = Math.max(0, sel.getBBox().x - box.clientWidth / 2);
}
$('#m-zurueck').addEventListener('click', () => schiebeMonat(-1));
$('#m-vor').addEventListener('click', () => schiebeMonat(1));
function schiebeMonat(d) {
  const ms = S.ue.monate, i = ms.findIndex((m) => m.ym === S.monat) + d;
  if (i >= 0 && i < ms.length) { S.monat = ms[i].ym; zeichneMonat(); }
}
async function katSheet(ym, kat) {
  oeffneSheet(`<div class="sh-kopf"><div><h3>${esc(kat)}</h3><div class="sh-meta">${ymName(ym)}</div></div>${zuKnopf()}</div><div class="lade">Lädt …</div>`);
  try {
    const rows = (await api(`buchungen?monat=${ym}&kat=${encodeURIComponent(kat)}`)).filter((r) => r.typ === 'Konsum' && !r.ign);
    const summe = rows.reduce((s, r) => s - r.b, 0);
    const liste = rows.map((r, i) => buchungsZeile(r, i, true)).join('');
    sheetInhalt(`<div class="sh-kopf"><div><h3>${esc(kat)}</h3><div class="sh-meta">${ymName(ym)} · ${rows.length} Buchungen · ${eur(summe)}</div></div>${zuKnopf()}</div>
      <div class="gruppe" style="margin-top:16px;box-shadow:none;background:var(--fl2)">${liste}</div>`);
    $('#sheet').querySelectorAll('.zeile').forEach((z) => z.addEventListener('click', () => buchungSheet(rows[+z.dataset.i], (neu) => { rows[+z.dataset.i] = neu; })));
  } catch (e) { fehler('#sheet .lade', e); }
}

// ---- Buchungen -------------------------------------------------------------
function buchungsZeile(r, i, mitDatum) {
  const plus = r.b > 0, offen = !r.rev && QUELLE[r.st];
  const unten = [r.cat, mitDatum ? datumKurz(r.d) : (r.prod || r.art)].filter(Boolean).join(' · ');
  return `<button class="zeile" data-i="${i}" style="${r.ign ? 'opacity:.45' : ''}">
    <div class="ava${plus ? ' ein' : ''}">${esc(initial(r.h))}</div>
    <div class="mitte"><div class="a">${esc(name(r.h))}</div><div class="b">${offen ? '<span class="punkt"></span>' : ''}${esc(unten)}</div></div>
    <div class="rechts"><div class="betrag zahl${plus ? ' plus' : ''}">${plus ? '+' : '−'}${nf2.format(Math.abs(r.b))}</div>${r.note ? '<div class="klein">✎ Notiz</div>' : ''}</div>
  </button>`;
}
function zeichneListe(rows, ziel, gruppiert) {
  if (!rows.length) { ziel.innerHTML = '<div class="leer"><b>Nichts gefunden</b>Anderer Suchbegriff oder anderer Monat?</div>'; return; }
  let html = '', tag = null, offen = false;
  rows.forEach((r, i) => {
    if (gruppiert && r.d !== tag) {
      if (offen) html += '</div>';
      const summe = rows.filter((x) => x.d === r.d).reduce((s, x) => s + x.b, 0);
      html += `<div class="tag"><span>${datumLang(r.d)}</span><span class="zahl">${summe > 0 ? '+' : '−'}${nf2.format(Math.abs(summe))}</span></div><div class="gruppe">`;
      tag = r.d; offen = true;
    }
    html += buchungsZeile(r, i, !gruppiert);
  });
  if (offen) html += '</div>';
  ziel.innerHTML = gruppiert ? html : `<div class="gruppe" style="margin-top:8px">${html}</div>`;
  ziel.querySelectorAll('.zeile').forEach((z) => z.addEventListener('click', () => {
    const i = +z.dataset.i;
    buchungSheet(rows[i], (neu) => { rows[i] = neu; zeichneListe(rows, ziel, gruppiert); });
  }));
}
async function ladeBuchungen() {
  try { if (!S.ue || S.ueAlt) await ladeUebersicht(); } catch (e) { if (!S.ue) return fehler('#b-liste', e); }
  if (!S.bMonat) S.bMonat = S.monat;
  const ms = S.ue.monate.slice().reverse();
  $('#b-monate').innerHTML = ms.map((m) => `<button class="chip${m.ym === S.bMonat ? ' an' : ''}" data-ym="${m.ym}">${ymKurz(m.ym)} ${m.ym.slice(2, 4)}</button>`).join('');
  $('#b-monate').querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
    S.bMonat = c.dataset.ym; $('#b-suche').value = ''; ladeBuchungen();
  }));
  const an = $('#b-monate .chip.an'); if (an) an.scrollIntoView({inline: 'center', block: 'nearest'});
  const q = $('#b-suche').value.trim();
  $('#b-liste').innerHTML = '<div class="lade">Lädt …</div>';
  try {
    const rows = await api(q ? 'buchungen?q=' + encodeURIComponent(q) : 'buchungen?monat=' + S.bMonat);
    S.bListe = rows;
    $('#b-unter').textContent = q ? `${rows.length}${rows.length >= 300 ? '+' : ''} Treffer in allen Monaten` : `${ymName(S.bMonat)} · ${rows.length} Buchungen`;
    zeichneListe(rows, $('#b-liste'), true);
  } catch (e) { fehler('#b-liste', e); }
}
let suchUhr;
$('#b-suche').addEventListener('input', () => {
  clearTimeout(suchUhr);
  suchUhr = setTimeout(() => {
    const q = $('#b-suche').value.trim();
    document.querySelectorAll('#b-monate .chip').forEach((c) => c.classList.toggle('an', !q && c.dataset.ym === S.bMonat));
    ladeBuchungen();
  }, 300);
});

// ---- Sheet -----------------------------------------------------------------
const zuKnopf = () => `<button class="zu" data-zu aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
let sheetOffen = false;
function oeffneSheet(html) {
  sheetInhalt(html);
  if (!sheetOffen) { history.pushState({sheet: 1}, ''); sheetOffen = true; }
  $('#deckel').classList.add('an'); $('#sheet').classList.add('an'); $('#sheet').scrollTop = 0;
}
function sheetInhalt(html) {
  $('#sheet').innerHTML = '<div class="griff"></div>' + html;
  $('#sheet').querySelectorAll('[data-zu]').forEach((b) => b.addEventListener('click', schliesseSheet));
}
function schliesseSheet() { if (sheetOffen) history.back(); }
function sheetZu() {
  sheetOffen = false;
  $('#deckel').classList.remove('an'); $('#sheet').classList.remove('an');
  if (document.activeElement) document.activeElement.blur();
}
window.addEventListener('popstate', () => { if (sheetOffen) sheetZu(); });
$('#deckel').addEventListener('click', schliesseSheet);
// Nach unten wischen am Griff schließt
(() => {
  let y0 = null;
  $('#sheet').addEventListener('touchstart', (e) => { y0 = $('#sheet').scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  $('#sheet').addEventListener('touchend', (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) schliesseSheet(); y0 = null; }, {passive: true});
})();

async function kategorienLaden() { if (!S.kats.length) S.kats = await api('kategorien'); return S.kats; }

function buchungSheet(r, beiAenderung) {
  const plus = r.b > 0;
  const offen = !r.rev && QUELLE[r.st];
  oeffneSheet(`
    <div class="sh-kopf"><div><h3>${esc(name(r.h))}</h3><div class="sh-meta">${datumLang(r.d)} · ${esc(r.konto)}</div></div>${zuKnopf()}</div>
    <div class="sh-betrag zahl${plus ? ' plus' : ''}">${plus ? '+' : '−'}${eur2(Math.abs(r.b))}</div>
    <div class="sh-meta">${esc(r.art)}${r.m && r.m !== r.d.slice(0, 7) ? ' · zählt für ' + ymName(r.m) : ''}</div>
    ${r.prod ? `<div class="feld"><div class="l">Produkt</div><div class="kasten" style="color:var(--akzent-text);font-weight:600">${esc(r.prod)}</div></div>` : ''}
    ${r.vz ? `<div class="feld"><div class="l">Verwendungszweck</div><div class="kasten">${esc(r.vz)}</div></div>` : ''}
    <div class="feld"><div class="l">Kategorie ${offen ? `<span class="pille acht" style="margin-left:6px;text-transform:none;letter-spacing:0">${QUELLE[r.st]}</span>` : ''}</div>
      <button class="kasten" id="sh-kat" style="width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--text);font-weight:600;font-size:15.5px">
        <span>${esc(r.cat)}</span><span style="color:var(--akzent-text);font-size:14px">Ändern</span></button>
      <div id="sh-katwahl" hidden style="margin-top:10px"></div>
    </div>
    <div class="feld">
      <label class="schalter"><div><div class="t">Geprüft</div><div class="u">Kategorie stimmt, kommt nicht mehr in „Prüfen“</div></div><input type="checkbox" id="sh-rev" ${r.rev ? 'checked' : ''}></label>
      <label class="schalter"><div><div class="t">Nicht mitzählen</div><div class="u">Aus Statistik und Monatssummen nehmen</div></div><input type="checkbox" id="sh-ign" ${r.ign ? 'checked' : ''}></label>
    </div>
    <div class="feld"><div class="l">Notiz</div><textarea id="sh-note" placeholder="z. B. Geschenk für …" enterkeyhint="done">${esc(r.note)}</textarea></div>
    <div class="hinweis">Änderungen gelten nur für diese Buchung. Regeln für alle Buchungen eines Händlers legst du am Rechner im Editor fest.</div>`);

  const neu = async (patch, meldung) => {
    try {
      const row = await speichern(r.id, patch);
      Object.assign(r, row); beiAenderung && beiAenderung(row);
      S.ueAlt = true;                         // Summen beim nächsten Öffnen frisch
      if (S.tab !== 'pruefen') S.pListe = null;
      toast(meldung);
      return row;
    } catch (e) { toast('Nicht gespeichert: ' + e.message); throw e; }
  };
  $('#sh-kat').addEventListener('click', async () => {
    const box = $('#sh-katwahl');
    if (!box.hidden) { box.hidden = true; return; }
    box.hidden = false;
    katAuswahl(box, r.cat, async (k) => {
      await neu({category: k, reviewed: 1}, 'Kategorie: ' + k);
      $('#sh-kat span').textContent = k; $('#sh-rev').checked = true; box.hidden = true;
    });
  });
  $('#sh-rev').addEventListener('change', (e) => neu({reviewed: e.target.checked ? 1 : 0}, e.target.checked ? 'Als geprüft markiert' : 'Nicht mehr geprüft').catch(() => { e.target.checked = !e.target.checked; }));
  $('#sh-ign').addEventListener('change', (e) => neu({ignore: e.target.checked ? 1 : 0}, e.target.checked ? 'Zählt nicht mehr mit' : 'Zählt wieder mit').catch(() => { e.target.checked = !e.target.checked; }));
  const note = $('#sh-note');
  note.addEventListener('blur', () => { if (note.value !== r.note) neu({note: note.value}, 'Notiz gespeichert').catch(() => {}); });
}
async function katAuswahl(box, aktuell, waehle) {
  box.innerHTML = '<div class="lade" style="padding:12px">Lädt …</div>';
  let kats;
  try { kats = await kategorienLaden(); } catch (e) { box.innerHTML = '<div class="hinweis">Kategorien nicht geladen.</div>'; return; }
  box.innerHTML = `<input class="katsuche" placeholder="Kategorie suchen …" autocomplete="off"><div class="katwahl"></div>`;
  const wahl = box.querySelector('.katwahl'), such = box.querySelector('.katsuche');
  const zeichne = () => {
    const q = such.value.trim().toLowerCase();
    const liste = kats.filter((k) => !q || k.toLowerCase().includes(q));
    wahl.innerHTML = liste.map((k, i) => `<button data-i="${i}" class="${k === aktuell ? 'an' : ''}">${esc(k)}</button>`).join('') || '<div class="hinweis" style="margin:0">Keine passende Kategorie. Neue legst du am Rechner an.</div>';
    wahl.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => waehle(liste[+b.dataset.i])));
  };
  such.addEventListener('input', zeichne); zeichne();
}

// ---- Prüfen ----------------------------------------------------------------
async function ladePruefen() {
  const box = $('#p-inhalt');
  try {
    if (!S.pListe) { box.innerHTML = '<div class="lade">Lädt …</div>'; S.pListe = await api('buchungen?offen=1');
      if (!S.ue) await ladeUebersicht().catch(() => {});
      S.pMehr = S.ue ? Math.max(0, S.ue.offen - S.pListe.length) : 0; }
  } catch (e) { return fehler('#p-inhalt', e); }
  zeichnePruefen();
}
function zeichnePruefen() {
  const box = $('#p-inhalt'), l = S.pListe;
  const rest = l.filter((r) => !r.erledigt).length;
  zaehler(rest + (S.pMehr || 0));
  if (!l.length) { box.innerHTML = '<div class="leer"><b>Alles geprüft</b>Die Automatik hat nichts mehr offen.</div>'; return; }
  const erledigt = l.length - rest;
  box.innerHTML = `<div class="karte" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:17px">${rest + (S.pMehr || 0)} offen</b><span style="color:var(--leise);font-size:13.5px">${erledigt ? erledigt + ' gerade erledigt' : 'neueste zuerst'}</span></div>
      <div class="fortschritt"><i style="width:${(erledigt / l.length * 100).toFixed(1)}%"></i></div>
    </div>` + l.map((r, i) => `
    <div class="pk${r.erledigt ? ' fertig' : ''}" data-i="${i}">
      <div class="o"><span class="h">${esc(name(r.h))}</span><span class="betrag zahl" style="${r.b > 0 ? 'color:var(--akzent-text)' : ''}">${r.b > 0 ? '+' : '−'}${eur2(Math.abs(r.b))}</span></div>
      <div class="meta">${datumKurz(r.d)} · ${esc(r.art)}</div>
      ${r.prod ? `<div class="prod">${esc(r.prod)}</div>` : ''}
      ${r.vz ? `<div class="vz">${esc(r.vz)}</div>` : ''}
      <div class="vorschlag"><b>${esc(r.cat)}</b><span class="pille ${r.erledigt ? 'gut' : 'neutral'}">${r.erledigt ? '✓ erledigt' : QUELLE[r.st] || ''}</span></div>
      ${r.erledigt ? '' : `<div class="knoepfe"><button class="knopf zweit" data-a="aendern">Ändern</button><button class="knopf haupt" data-a="passt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Passt</button></div>`}
    </div>`).join('');
  box.querySelectorAll('.pk').forEach((k) => {
    const r = l[+k.dataset.i];
    k.querySelector('[data-a="passt"]')?.addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      try { Object.assign(r, await speichern(r.id, {reviewed: 1}), {erledigt: true}); S.ueAlt = true; zeichnePruefen(); }
      catch (err) { toast('Nicht gespeichert: ' + err.message); e.currentTarget.disabled = false; }
    });
    k.querySelector('[data-a="aendern"]')?.addEventListener('click', () => {
      oeffneSheet(`<div class="sh-kopf"><div><h3>${esc(name(r.h))}</h3><div class="sh-meta">${r.b > 0 ? '+' : '−'}${eur2(Math.abs(r.b))} · ${datumKurz(r.d)}</div></div>${zuKnopf()}</div>
        ${r.vz ? `<div class="feld"><div class="kasten">${esc(r.vz)}</div></div>` : ''}
        <div class="feld"><div class="l">Richtige Kategorie</div><div id="pk-wahl"></div></div>`);
      katAuswahl($('#pk-wahl'), r.cat, async (kat) => {
        try {
          Object.assign(r, await speichern(r.id, {category: kat, reviewed: 1}), {erledigt: true});
          S.ueAlt = true; schliesseSheet(); toast('Kategorie: ' + kat); zeichnePruefen();
        } catch (err) { toast('Nicht gespeichert: ' + err.message); }
      });
    });
    k.querySelector('.o').addEventListener('click', () => buchungSheet(r, () => { r.erledigt = !!r.rev; zeichnePruefen(); }));
  });
}

// ---- Verträge --------------------------------------------------------------
const RHYTHMUS = {'monatlich': 'monatlich', 'quartalsweise': 'vierteljährlich', 'halbjährlich': 'halbjährlich', 'jährlich': 'jährlich'};
async function ladeVertraege() {
  const box = $('#vt-inhalt');
  try { if (!S.vt) S.vt = await api('vertraege'); } catch (e) { return fehler('#vt-inhalt', e); }
  const alle = S.vt.filter((c) => c.status !== 'rejected');
  const aus = alle.filter((c) => c.aktiv && c.richtung === 'Ausgabe').sort((a, b) => b.monatlich - a.monatlich);
  const ein = alle.filter((c) => c.aktiv && c.richtung === 'Einnahme').sort((a, b) => b.monatlich - a.monatlich);
  const alt = alle.filter((c) => !c.aktiv);
  const summe = aus.reduce((s, c) => s + c.monatlich, 0), einSumme = ein.reduce((s, c) => s + c.monatlich, 0);
  const zeile = (c, i) => {
    const plus = c.richtung === 'Einnahme';
    const rh = RHYTHMUS[c.rhythmus] || c.rhythmus;
    return `<button class="zeile" data-id="${esc(c.id)}">
      <div class="ava${plus ? ' ein' : ''}">${esc(initial(c.name))}</div>
      <div class="mitte"><div class="a">${esc(name(c.name))}</div><div class="b">${c.status === 'candidate' ? '<span class="punkt"></span>' : ''}${esc(c.kategorie || '')} · ${esc(rh)}</div></div>
      <div class="rechts"><div class="betrag zahl${plus ? ' plus' : ''}">${eur(c.monatlich)}</div><div class="klein">${c.rhythmus === 'monatlich' ? '' : eur(Math.abs(c.betrag)) + ' ' + esc(rh)}</div></div>
    </button>`;
  };
  box.innerHTML = `
    <div class="karte held">
      <div class="titel">Feste Ausgaben</div>
      <div class="gross zahl">${nf0.format(Math.round(summe))}<small>€ / Monat</small></div>
      <div style="color:var(--leise);font-size:14px">${eur(summe * 12)} im Jahr · ${aus.length} laufende Verträge</div>
      ${ein.length ? `<div class="drei" style="grid-template-columns:1fr 1fr"><div><div class="l">Feste Einnahmen</div><div class="w zahl">${eur(einSumme)}</div></div><div><div class="l">Bleibt nach Fixkosten</div><div class="w zahl">${eur(einSumme - summe)}</div></div></div>` : ''}
    </div>
    <div class="tag"><span>Ausgaben</span><span>pro Monat</span></div><div class="gruppe">${aus.map(zeile).join('')}</div>
    ${ein.length ? `<div class="tag"><span>Einnahmen</span></div><div class="gruppe">${ein.map(zeile).join('')}</div>` : ''}
    ${alt.length ? `<div class="tag"><span>Ausgelaufen</span></div><div class="gruppe" style="opacity:.6">${alt.map(zeile).join('')}</div>` : ''}
    <div class="fuss">Unregelmäßige Beträge sind auf den Monat umgerechnet. <span class="punkt"></span>noch nicht bestätigt — bestätigen und umbenennen geht am Rechner.</div>`;
  box.querySelectorAll('.zeile').forEach((z) => z.addEventListener('click', () => vertragSheet(S.vt.find((c) => c.id === z.dataset.id))));
}
async function vertragSheet(c) {
  const kopf = `<div class="sh-kopf"><div><h3>${esc(name(c.name))}</h3><div class="sh-meta">${esc(c.kategorie || '')} · ${esc(RHYTHMUS[c.rhythmus] || c.rhythmus)}${c.status === 'candidate' ? ' · unbestätigt' : ''}</div></div>${zuKnopf()}</div>
    <div class="sh-betrag zahl">${eur2(Math.abs(c.betrag))}</div>
    <div class="sh-meta">${eur(c.monatlich)} pro Monat · ${eur(c.jaehrlich)} im Jahr</div>
    <div class="drei" style="grid-template-columns:1fr 1fr">
      <div><div class="l">Zuletzt</div><div class="w">${c.letzte ? datumKurz(c.letzte) : '—'}</div></div>
      <div><div class="l">Als Nächstes</div><div class="w">${c.aktiv && c.naechste ? datumKurz(c.naechste) : '—'}</div></div>
    </div>
    ${c.zweck ? `<div class="feld"><div class="l">Zweck</div><div class="kasten">${esc(c.zweck)}</div></div>` : ''}`;
  oeffneSheet(kopf + '<div class="lade">Lädt …</div>');
  try {
    const rows = await api('vertrag?id=' + encodeURIComponent(c.id));
    sheetInhalt(kopf + `<div class="feld"><div class="l">${rows.length} Zahlungen</div>
      <div class="gruppe" style="box-shadow:none;background:var(--fl2)">${rows.slice(0, 40).map((r) => `<div class="zeile" style="min-height:48px;padding:9px 14px">
        <div class="mitte"><div class="a" style="font-weight:500;font-size:14.5px">${datumKurz(r.d)}</div></div>
        <div class="rechts"><div class="betrag zahl${r.b > 0 ? ' plus' : ''}" style="font-size:14.5px">${r.b > 0 ? '+' : '−'}${eur2(Math.abs(r.b))}</div></div></div>`).join('')}</div></div>`);
  } catch (e) { fehler('#sheet .lade', e); }
}

// ---- Vermögen --------------------------------------------------------------
async function ladeVermoegen() {
  const box = $('#vm-inhalt');
  try { if (!S.vm) S.vm = await api('vermoegen'); } catch (e) { return fehler('#vm-inhalt', e); }
  const v = S.vm;
  if (v.fehler) { box.innerHTML = `<div class="leer"><b>Vermögen nicht verfügbar</b>${esc(v.fehler)}</div>`; return; }
  const su = v.summen;
  $('#vm-unter').textContent = 'Stand ' + datumKurz(v.stichtag);
  const spanneKurz = (a, b) => Math.abs(b - a) < 1 ? eur(a) : nf0.format(Math.round(a / 1000)) + '–' + nf0.format(Math.round(b / 1000)) + ' Tsd. €';
  const gruppen = [['anlagen', 'Konten und Depot'], ['immobilien', 'Immobilien'], ['schulden', 'Kredite']];
  const max = Math.max(su.anlagen, su.immo_max, Math.abs(su.schulden));
  const balken = (lo, hi, farbe) => `<div class="spur" style="position:relative;height:8px;border-radius:4px;background:var(--fl2);margin:8px 0 2px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${(lo / max * 100).toFixed(1)}%;background:${farbe};border-radius:4px"></div>
      ${hi > lo + 1 ? `<div style="position:absolute;left:${(lo / max * 100).toFixed(1)}%;top:0;bottom:0;width:${((hi - lo) / max * 100).toFixed(1)}%;background:${farbe};opacity:.35;border-radius:0 4px 4px 0"></div>` : ''}</div>`;
  const GUETE = {exakt: ['gut', 'exakt'], gut: ['neutral', 'geschätzt'], grob: ['acht', 'grob geschätzt']};
  const zeilen = (g) => v.zeilen.filter((z) => z.gruppe === g).map((z) => {
    const gu = GUETE[z.guete] || ['neutral', z.guete || ''];
    return `<div class="zeile">
      <div class="mitte"><div class="a" style="white-space:normal">${esc(z.name)}</div><div class="b" style="white-space:normal">${esc(z.anteil_text || '')}${z.anteil_text ? ' · ' : ''}${z.stand && z.stand !== v.stichtag ? 'Stand ' + datumKurz(z.stand) : ''}</div></div>
      <div class="rechts"><div class="betrag zahl">${z.gruppe === 'schulden' ? '−' : ''}${spanneKurz(Math.abs(z.a_min), Math.abs(z.a_max))}</div>${z.guete !== 'exakt' ? `<div class="klein"><span class="pille ${gu[0]}" style="padding:1px 7px;font-size:11px">${gu[1]}</span></div>` : ''}</div>
    </div>`;
  }).join('');
  const depotSumme = (v.depot || []).reduce((s, p) => s + p.wert, 0);
  box.innerHTML = `
    <div class="karte held">
      <div class="titel">Netto</div>
      <div class="gross zahl" style="font-size:38px">${spanneKurz(su.netto_min, su.netto_max).replace(' Tsd. €', '<small>Tsd. €</small>')}</div>
      <div style="color:var(--leise);font-size:13.5px">${esc(v.sicht)}</div>
      <div style="margin-top:18px">
        <div class="z1" style="display:flex;justify-content:space-between;font-size:14.5px"><span>Konten und Depot</span><b class="zahl">${eur(su.anlagen)}</b></div>${balken(su.anlagen, su.anlagen, 'var(--akzent)')}
        <div class="z1" style="display:flex;justify-content:space-between;font-size:14.5px;margin-top:12px"><span>Immobilien</span><b class="zahl">${spanneKurz(su.immo_min, su.immo_max)}</b></div>${balken(su.immo_min, su.immo_max, 'var(--akzent)')}
        <div class="z1" style="display:flex;justify-content:space-between;font-size:14.5px;margin-top:12px"><span>Kredite</span><b class="zahl">−${eur(Math.abs(su.schulden))}</b></div>${balken(Math.abs(su.schulden), Math.abs(su.schulden), 'var(--balken)')}
      </div>
    </div>
    ${gruppen.map(([g, t]) => `<div class="tag"><span>${t}</span></div><div class="gruppe">${zeilen(g)}</div>`).join('')}
    ${(v.depot || []).length ? `<div class="tag"><span>Depot</span><span class="zahl">${eur(depotSumme)}</span></div><div class="gruppe">${v.depot.map((p) => `<div class="zeile">
      <div class="mitte"><div class="a">${esc(p.name)}</div><div class="b">${esc(p.klasse || '')} · ${nf2.format(p.stueck)} Stk.</div></div>
      <div class="rechts"><div class="betrag zahl">${eur(p.wert)}</div><div class="klein zahl">${p.gv >= 0 ? '▲ +' : '▼ −'}${eur(Math.abs(p.gv))}</div></div></div>`).join('')}</div>` : ''}
    <div class="fuss">Hellere Balkenspitze: Spanne der Schätzung.${v.nicht_enthalten ? '<br>Nicht enthalten: ' + esc(v.nicht_enthalten) : ''}</div>`;
}

// ---- Fehler ----------------------------------------------------------------
function fehler(ziel, e) {
  const el = typeof ziel === 'string' ? $(ziel) : ziel;
  if (!el || e.message === 'nicht angemeldet') return;
  el.outerHTML = `<div class="leer"><b>Nicht geladen</b>${navigator.onLine ? 'Der Server antwortet nicht. Später noch einmal versuchen.' : 'Kein Netz. Bist du im Tailnet?'}</div>`;
}

// ---- Start -----------------------------------------------------------------
document.querySelectorAll('nav.tabs a').forEach((a) => a.addEventListener('click', (e) => {
  e.preventDefault();
  if (sheetOffen) { sheetZu(); history.replaceState(null, '', '#' + a.dataset.tab); zeige(a.dataset.tab); return; }
  if (location.hash === '#' + a.dataset.tab) { zeige(a.dataset.tab); return; }
  location.hash = a.dataset.tab;
}));
// Zurück in die App nach längerer Pause: Zahlen frisch holen.
let weg = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { weg = Date.now(); return; }
  if (weg && Date.now() - weg > 5 * 60e3) { S.ueAlt = true; S.pListe = null; S.vt = null; S.vm = null; zeige(S.tab); }
});
window.addEventListener('resize', () => { if (S.tab === 'monat' && S.ue) zeichneDiagramm(); });
zeige(location.hash.slice(1) || 'monat');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {scope: './'}).catch(() => {});
</script>
</body>
